<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORE4GLE - Mini Golf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2a2a2a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            padding: 20px;
        }
        h1 { color: white; font-size: 2.5em; }
        canvas {
            border: 4px solid white;
            background: linear-gradient(180deg, #5dd962 0%, #3db13f 100%);
            cursor: grab;
            display: block;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }
        canvas:active { cursor: grabbing; }
        .info { color: white; text-align: center; max-width: 750px; }
        .info-text { font-size: 0.95em; margin: 4px 0; }
        .sunk-message { font-size: 1.3em; font-weight: bold; color: #ffd700; margin-top: 8px; min-height: 1.6em; }
        .buttons { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
        button {
            padding: 12px 32px;
            font-size: 1em;
            background: white;
            color: #2a2a2a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button[hidden] { display: none; }
        button:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>FORE4GLE 🚩</h1>
        <canvas id="gameCanvas" width="750" height="700"></canvas>
        <div class="info">
            <div class="info-text" id="holeInfo">Loading...</div>
            <div class="info-text">Drag back from the ball and release to shoot (slingshot)</div>
            <div class="info-text">Strokes: <span id="strokes">0</span> | Velocity: <span id="velocity">0.0</span></div>
            <div class="sunk-message" id="sunkInfo"></div>
            <div class="buttons">
                <button id="actionBtn" hidden></button>
                <button id="resetBtn">Restart hole</button>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const strokesEl = document.getElementById('strokes');
        const velocityEl = document.getElementById('velocity');
        const holeInfoEl = document.getElementById('holeInfo');
        const sunkInfoEl = document.getElementById('sunkInfo');
        const actionBtn = document.getElementById('actionBtn');
        const resetBtn = document.getElementById('resetBtn');

        let gs = null;          // last GameState from Rust
        let busy = false;
        let drag = null;        // { start: {x,y}, now: {x,y} } while aiming
        let invoke = null;

        function scoreName(strokes, par) {
            const d = strokes - par;
            if (strokes === 1) return 'Hole in one';
            if (d <= -2) return 'Eagle';
            if (d === -1) return 'Birdie';
            if (d === 0) return 'Par';
            if (d === 1) return 'Bogey';
            if (d === 2) return 'Double bogey';
            return `+${d}`;
        }

        function canvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function nearBall(p) {
            const b = gs.ball.position;
            return Math.hypot(p.x - b.x, p.y - b.y) < 30;
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!gs || gs.ball_sunk !== null) return;
            const p = canvasPos(e);
            if (nearBall(p)) {
                canvas.setPointerCapture(e.pointerId);
                drag = { start: p, now: p };
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (drag) drag.now = canvasPos(e);
        });

        canvas.addEventListener('pointerup', async (e) => {
            if (!drag) return;
            const end = canvasPos(e);
            const dx = drag.start.x - end.x;
            const dy = drag.start.y - end.y;
            const power = Math.min(Math.hypot(dx, dy) / 100, 1.0);
            const angle = Math.atan2(dy, dx);
            drag = null;
            if (power > 0.05) {
                await invoke('strike_ball', { angle, power });
                gs = await invoke('get_game_state');
            }
        });

        canvas.addEventListener('pointercancel', () => { drag = null; });

        resetBtn.addEventListener('click', async () => {
            gs = await invoke('reset_game');
        });

        actionBtn.addEventListener('click', async () => {
            gs = await invoke('next_hole');
        });

        function updateUI() {
            const hole = gs.hole_layout;
            holeInfoEl.textContent = `Hole ${gs.hole_index + 1} of ${gs.hole_count}: ${hole.name} · Par ${hole.par}`;
            strokesEl.textContent = gs.strokes;
            velocityEl.textContent = Math.hypot(gs.ball.velocity.x, gs.ball.velocity.y).toFixed(1);

            if (gs.ball_sunk !== null) {
                const last = gs.hole_index === gs.hole_count - 1;
                if (last) {
                    const total = gs.scores.reduce((a, s) => a + (s ?? 0), 0);
                    sunkInfoEl.textContent = `🏆 Course complete: ${total} strokes`;
                    actionBtn.textContent = 'Play again';
                } else {
                    sunkInfoEl.textContent = `⭐ ${scoreName(gs.strokes, hole.par)}! (${gs.strokes}) ⭐`;
                    actionBtn.textContent = `Next hole (${gs.hole_index + 2})`;
                }
                actionBtn.hidden = false;
            } else {
                sunkInfoEl.textContent = '';
                actionBtn.hidden = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!gs) return;

            // Walls
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            for (const w of gs.hole_layout.walls) {
                ctx.beginPath();
                ctx.moveTo(w.x1, w.y1);
                ctx.lineTo(w.x2, w.y2);
                ctx.stroke();
            }

            // Cup
            for (const h of gs.hole_layout.holes) {
                ctx.fillStyle = 'rgba(40, 120, 50, 0.8)';
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.radius + 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.radius * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }

            // Ball
            const b = gs.ball.position;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(b.x, b.y, gs.ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Slingshot aim line
            if (drag) {
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(drag.now.x, drag.now.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        async function loop() {
            if (!busy && invoke) {
                busy = true;
                try {
                    gs = await invoke('update_game', { dt: 1 / 60 });
                } finally {
                    busy = false;
                }
            }
            if (gs) {
                draw();
                updateUI();
            }
            requestAnimationFrame(loop);
        }

        function start() {
            const tauri = window.__TAURI__;
            if (!tauri) {
                setTimeout(start, 100);
                return;
            }
            invoke = tauri.core.invoke;
            invoke('init_game').then((s) => { gs = s; requestAnimationFrame(loop); });
        }

        start();
    </script>
</body>
</html>
